
<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GANESHA Live Quiz — Host</title><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui;background:radial-gradient(circle at top,#253c8f,#090d24 65%);color:white;min-height:100vh}
.wrap{max-width:1300px;margin:auto;padding:22px}.top{display:flex;justify-content:space-between;gap:18px;align-items:center}.brand{font-size:30px;font-weight:900}.pill{padding:9px 15px;border:1px solid #ffffff44;border-radius:999px;background:#ffffff12}
.grid{display:grid;grid-template-columns:300px 1fr;gap:20px;margin-top:20px}.card{background:#ffffff0d;border:1px solid #ffffff25;border-radius:20px;padding:20px;box-shadow:0 15px 40px #0005}
.qr{width:230px;height:230px;background:white;border-radius:14px;padding:10px;display:block;margin:10px auto}.pin{font-size:42px;font-weight:1000;letter-spacing:7px;text-align:center}.small{text-align:center;color:#cbd3ff;font-size:13px}
button{border:0;border-radius:12px;padding:12px 17px;font-weight:800;cursor:pointer;background:#fff;color:#111;margin:4px}button.primary{background:#ffd35a}button:disabled{opacity:.35;cursor:not-allowed}
.board{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin:14px 0}.tile{min-height:74px;font-weight:800}.tile.used{opacity:.25}.question{font-size:34px;font-weight:900;line-height:1.15;margin:18px 0}.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}.opt{font-size:20px;text-align:left;background:#ffffff12;color:white;border:1px solid #ffffff25}.opt.correct{background:#167d45}.opt.wrong{background:#9a2635}.timer{font-size:52px;font-weight:1000}.leader{display:grid;gap:7px}.row{display:flex;justify-content:space-between;background:#ffffff0d;padding:10px 12px;border-radius:10px}.explain{background:#fff8d31a;border-left:4px solid #ffd35a;padding:14px;border-radius:8px;margin-top:15px}.hidden{display:none}@media(max-width:800px){.grid{grid-template-columns:1fr}.board{grid-template-columns:repeat(4,1fr)}.question{font-size:26px}}
</style></head><body><div class="wrap">
<div class="top"><div class="brand">🏆 GANESHA Ultimate Brain Challenge</div><div class="pill">HOST / BIG SCREEN</div></div>
<div class="grid"><aside class="card">
<h2>📱 Players Join</h2><img id="qr" class="qr" alt="Player QR"><div class="pin" id="pin">------</div><div class="small">Scan the QR • Enter your name • Join</div>
<hr style="border-color:#ffffff22;margin:18px 0"><div>Participants: <b id="count">0</b></div><div id="status" class="small" style="margin-top:8px">Creating game…</div>
<div style="margin-top:14px"><button class="primary" id="new">NEW GAME</button><button id="reveal">REVEAL ANSWER</button></div>
</aside>
<main class="card"><div id="intro"><h1>Ready?</h1><p>Start a new game, wait for participants to scan the QR, then select a question.</p></div>
<div id="game" class="hidden"><div class="pill" id="cat"></div><div class="timer" id="timer">30</div><div class="question" id="q"></div><div class="opts" id="opts"></div><div id="explain" class="explain hidden"></div></div>
<div id="board" class="board"></div><h2>🏆 Live Leaderboard</h2><div id="leaders" class="leader"></div></main></div></div>
<script>
let ws,code,data,cur=-1,timerInt;
const $=id=>document.getElementById(id);
async function newGame(){let r=await fetch('/api/room',{method:'POST'});data=await r.json();code=data.code;$('pin').textContent=code;$('qr').src=data.qr;$('status').textContent='Students can scan now.'; connect();}
function connect(){if(ws)ws.close();ws=new WebSocket(`${location.protocol==='https:'?'wss':'ws'}://${location.host}`);ws.onopen=()=>ws.send(JSON.stringify({type:'host_create',code}));ws.onmessage=e=>{let m=JSON.parse(e.data);
if(m.type==='host_ready'){buildBoard(m.questions); $('status').textContent='Game connected.'}
if(m.type==='players'){renderLeaders(m.players);$('count').textContent=m.players.length}
if(m.type==='question_host')showQ(m);
if(m.type==='answer_received')$('status').textContent=`${m.name} answered ${m.correct?'✓ correct':'✗ incorrect'} (+${m.points})`;
if(m.type==='reveal')reveal(m);
if(m.type==='error')alert(m.message);
}}
function buildBoard(qs){$('board').innerHTML='';qs.forEach((q,i)=>{let b=document.createElement('button');b.className='tile';b.textContent=`${i+1}. ${q[1].split('—')[0]}`;b.onclick=()=>{cur=i;ws.send(JSON.stringify({type:'host_question',index:i}))};$('board').appendChild(b)})}
function showQ(m){$('intro').classList.add('hidden');$('game').classList.remove('hidden');$('cat').textContent=m.category;$('q').textContent=m.text;$('explain').classList.add('hidden');$('opts').innerHTML='';m.options.forEach((x,i)=>{let b=document.createElement('button');b.className='opt';b.textContent=`${String.fromCharCode(65+i)}. ${x}`;b.disabled=true;$('opts').appendChild(b)});let t=30;clearInterval(timerInt);$('timer').textContent=t;timerInt=setInterval(()=>{t--;$('timer').textContent=t;if(t<=0)clearInterval(timerInt)},1000)}
function reveal(m){clearInterval(timerInt);[...$('opts').children].forEach((b,i)=>{if(i===m.correctIndex)b.classList.add('correct')});$('explain').innerHTML='<b>💡 Explanation</b><br>'+m.explanation;$('explain').classList.remove('hidden');renderLeaders(m.players)}
function renderLeaders(ps){$('leaders').innerHTML=ps.length?ps.slice(0,10).map(p=>`<div class="row"><span>${p.rank}. ${escapeHtml(p.name)}</span><b>${p.score}</b></div>`).join(''):'<div class="small">Waiting for participants…</div>'}
function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
$('new').onclick=newGame;$('reveal').onclick=()=>ws&&ws.send(JSON.stringify({type:'host_reveal'}));newGame();
</script></body></html>
