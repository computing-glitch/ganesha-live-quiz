
<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Join GANESHA Quiz</title><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui;background:linear-gradient(160deg,#101b50,#090b1d);color:white;min-height:100vh}.wrap{max-width:560px;margin:auto;padding:20px}.card{background:#ffffff10;border:1px solid #ffffff22;border-radius:22px;padding:22px;margin-top:15px}h1{font-size:32px}input{width:100%;padding:15px;border-radius:12px;border:1px solid #ffffff33;background:#ffffff0d;color:white;font-size:18px;margin:7px 0}button{width:100%;padding:15px;border:0;border-radius:12px;font-size:18px;font-weight:900;margin-top:10px}.primary{background:#ffd35a}.question{font-size:24px;font-weight:900;line-height:1.2}.opt{background:#ffffff12;color:white;border:1px solid #ffffff2c;text-align:left}.opt:disabled{opacity:.5}.selected{outline:3px solid #ffd35a}.correct{background:#16804a!important}.wrong{background:#a42b3d!important}.score{font-size:34px;font-weight:1000}.timer{font-size:45px;font-weight:1000}.muted{color:#cbd3ff}.hidden{display:none}</style></head><body><div class="wrap">
<div class="card" id="join"><h1>🧠 GANESHA Quiz</h1><p class="muted">Enter your name and the game PIN shown on the big screen.</p><input id="name" placeholder="Your name"><input id="pin" inputmode="numeric" placeholder="6-digit Game PIN"><button class="primary" id="joinBtn">JOIN GAME</button><p id="msg" class="muted"></p></div>
<div class="card hidden" id="play"><h2 id="hello"></h2><div class="timer" id="timer">30</div><div class="question" id="q"></div><div id="opts"></div><div id="result" class="hidden"></div></div>
<script>
let ws,room=new URLSearchParams(location.search).get('room')||'',answered=false,intv;
const $=x=>document.getElementById(x);
if(room)$('pin').value=room;
$('joinBtn').onclick=()=>{let name=$('name').value.trim(),pin=$('pin').value.trim();if(!name||!pin)return $('msg').textContent='Please enter both name and PIN.';ws=new WebSocket(`${location.protocol==='https:'?'wss':'ws'}://${location.host}`);ws.onopen=()=>ws.send(JSON.stringify({type:'player_join',name,code:pin}));ws.onmessage=e=>handle(JSON.parse(e.data));ws.onclose=()=>$('msg').textContent='Connection closed.'};
function handle(m){if(m.type==='joined'){$('join').classList.add('hidden');$('play').classList.remove('hidden');$('hello').textContent='Welcome, '+m.name+'!';}
if(m.type==='question'){answered=false;$('result').classList.add('hidden');$('q').textContent=m.text;$('opts').innerHTML='';m.options.forEach((x,i)=>{let b=document.createElement('button');b.className='opt';b.textContent=`${String.fromCharCode(65+i)}. ${x}`;b.onclick=()=>answer(i);$('opts').appendChild(b)});let t=30;clearInterval(intv);$('timer').textContent=t;intv=setInterval(()=>{t--;$('timer').textContent=t;if(t<=0){clearInterval(intv);[...$('opts').children].forEach(b=>b.disabled=true)}},1000)}
if(m.type==='answer_result'){clearInterval(intv);[...$('opts').children].forEach((b,i)=>{b.disabled=true;if(i===m.correctIndex)b.classList.add('correct')});$('result').classList.remove('hidden');$('result').innerHTML=`<p class="score">${m.correct?'✓ Correct!':'✗ Not quite'}</p><p>Points: <b>${m.points}</b></p><p><b>💡 Explanation</b><br>${m.explanation}</p>`}
if(m.type==='reveal'){[...$('opts').children].forEach((b,i)=>{if(i===m.correctIndex)b.classList.add('correct')});$('result').classList.remove('hidden');$('result').innerHTML=`<p><b>💡 Explanation</b><br>${m.explanation}</p>`}
if(m.type==='error')$('msg').textContent=m.message}
function answer(i){if(answered)return;answered=true;ws.send(JSON.stringify({type:'player_answer',answer:i}));[...$('opts').children].forEach((b,j)=>{b.disabled=true;if(j===i)b.classList.add('selected')})}
</script></body></html>
